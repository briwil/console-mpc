<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Console</title>
<style>
  @font-face { font-family: BC; src: url(/fonts/BarlowCondensed-Medium.ttf); font-weight: 500; }
  @font-face { font-family: BC; src: url(/fonts/BarlowCondensed-SemiBold.ttf); font-weight: 600; }
  @font-face { font-family: BC; src: url(/fonts/BarlowCondensed-Bold.ttf); font-weight: 700; }
  @font-face { font-family: BC; src: url(/fonts/BarlowCondensed-ExtraBold.ttf); font-weight: 800; }
  :root {
    --bg: #0b0c0e; --panel: #131519; --line: #23262d; --dim: #5c616c; --text: #e8e9ec; --soft: #a3a8b3;
    --amber: #f2b33d; --red: #ff5a4e; --green: #49d17d; --orange: #ff9a3c;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #offline { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 1.2vh; background: rgba(11,12,14,.92); font-size: 2.4vh; color: var(--soft); text-align: center; }
  #offline b { color: var(--text); font-size: 3.2vh; font-weight: 600; }
  #fs { position: fixed; left: 50%; top: 1.6vh; transform: translateX(-50%); padding: .8vh 1.2vw; border-radius: 1vh; border: 1px solid var(--line);
    background: var(--panel); color: var(--soft); font-size: 1.9vh; font-family: BC, sans-serif; font-weight: 600; letter-spacing: .12em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="offline"><b>Looking for Console…</b><span>The Move and this device need to be on the same Wi-Fi (or this phone's hotspot),<br>with Console running.</span></div>
<button id="fs">Full screen</button>
<script>
"use strict";
const cv = document.getElementById("c"), g = cv.getContext("2d");
// one colour family, picked at random each time the page opens; 8 shades of it, one per track / lane (the
// lightness steps so neighbours stand apart). PAL[0] is the accent.
const FAMILIES = {ORANGE: [26, 0.92], GREEN: [142, 0.62], YELLOW: [45, 0.90], TEAL: [172, 0.62], PURPLE: [268, 0.62]};
function hsl(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
}
function family(name) {
  const [h, sat] = FAMILIES[name], L = [0.62, 0.48, 0.72, 0.55, 0.67, 0.44, 0.59, 0.77], SS = [1, 1, 0.85, 1, 0.9, 0.95, 1, 0.8];
  return L.map((l, i) => hsl(((h + (i - 3.5) * 2.2) % 360 + 360) % 360, sat * SS[i], l));
}
const FAMILY = "%%FAMILY%%" in FAMILIES ? "%%FAMILY%%" : Object.keys(FAMILIES)[Math.floor(Math.random() * 5)];   // (the Move's, this start)
const COLORS = family(FAMILY), ACC = COLORS[0];
let SEQ = null, SEQ_ID = "", seqWant = "";
let S = null, got = 0, waves = {}, want = {}, fails = 0, dpr = 1, W = 0, H = 0, screenImg = null, screenKey = "";

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  cv.width = W; cv.height = H;
}
addEventListener("resize", resize); resize();

document.getElementById("fs").onclick = () => {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  try { screen.orientation.lock("landscape"); } catch (e) {}
};
document.addEventListener("fullscreenchange", () => {
  document.getElementById("fs").style.display = document.fullscreenElement ? "none" : "";
});

function took(st) {
  S = st; got = performance.now(); fails = 0;
  document.getElementById("offline").style.display = "none";
  for (const t of S.tracks) for (const id of t.waves) if (!waves[id] && !want[id]) loadWave(id);
  if (S.page === "seq" && S.seq_id && S.seq_id !== SEQ_ID && seqWant !== S.seq_id) loadSeq(S.seq_id);
}
// the Move pushes its state as it changes (no asking); if that can't work here, ask 15 times a second
let polling = false, lastMsg = 0;
function listen() {
  let es;
  try { es = new EventSource("/events"); } catch (e) { startPoll(); return; }
  es.onmessage = ev => { lastMsg = performance.now(); try { took(JSON.parse(ev.data)); } catch (e) {} };
  es.onerror = () => { if (++fails > 8) document.getElementById("offline").style.display = "flex"; };
  setInterval(() => { if (!polling && lastMsg && performance.now() - lastMsg > 4000) { es.close(); startPoll(); } }, 2000);
  setTimeout(() => { if (!lastMsg && !polling) { es.close(); startPoll(); } }, 5000);
}
function startPoll() { if (!polling) { polling = true; poll(); } }
async function poll() {
  try {
    const r = await fetch("/state", {cache: "no-store"});
    took(await r.json());
  } catch (e) {
    if (++fails > 8) document.getElementById("offline").style.display = "flex";
  }
  setTimeout(poll, 66);
}
async function loadWave(id) {
  want[id] = 1;
  try {
    const r = await fetch("/wave/" + id);
    const buf = new Uint8Array(await r.arrayBuffer());
    const ch = id.split(":")[0];
    for (const k of Object.keys(waves)) if (k.split(":")[0] === ch && k !== id) delete waves[k];
    waves[id] = buf;
  } catch (e) {}
  delete want[id];
}
async function loadSeq(id) {
  seqWant = id;
  try { const r = await fetch("/seq/" + id); if (r.ok) { SEQ = await r.json(); SEQ_ID = id; } } catch (e) {}
  seqWant = "";
}
listen();

function pos() {                       // the playhead, moved on between the Move's updates while playing
  if (!S) return 0;
  return S.playing ? S.pos + Math.min(0.5, (performance.now() - got) / 1000) * S.bpm / 60 : S.pos;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const FONT = "BC, 'Barlow Condensed', system-ui, sans-serif";
for (const w of [500, 600, 700, 800]) { try { document.fonts.load(w + " 20px BC"); } catch (e) {} }
function font(size, weight, spacing) {
  g.font = (weight || 500) + " " + Math.round(size) + "px " + FONT;
  if ("letterSpacing" in g) g.letterSpacing = (spacing ? Math.round(size * spacing) : 0) + "px";
}
function text(s, x, y, size, color, weight, align, fnt, spacing) {
  if (fnt && fnt !== MONO) g.font = (weight || 500) + " " + Math.round(size) + "px " + fnt; else font(size, weight, spacing);
  if (fnt === MONO) font(size, weight, spacing);
  g.fillStyle = color; g.textAlign = align || "left"; g.textBaseline = "middle"; g.fillText(s, x, y);
}
function tw(s, size, weight, spacing) { font(size, weight, spacing); return g.measureText(s).width; }
const MONO = "ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace";

function draw() {
  requestAnimationFrame(draw);
  g.fillStyle = "#0b0c0e"; g.fillRect(0, 0, W, H);
  if (!S) return;
  const u = Math.min(W / 2448, H / 1848) * 1.0;          // one unit: the Fold's open screen at 1
  const pad = 28 * u, P = pos();
  // ---------------------------------------------------------------- the top line
  const topH = 116 * u, cyT = topH / 2;
  const st = S.recording ? (S.overdub ? "ODUB" : "REC") : S.playing ? "PLAY" : "STOP";
  const stc = S.recording ? (S.overdub ? "#ff9a3c" : "#ff5a4e") : S.playing ? "#49d17d" : "#5c616c";
  let w0 = tw(st, 44 * u, 800, 0.08) + 64 * u;
  rr(pad, cyT - 32 * u, w0, 64 * u, 16 * u); g.fillStyle = stc; g.fill();
  text(st, pad + w0 / 2, cyT + 2 * u, 44 * u, "#0b0c0e", 800, "center", null, 0.08);
  let x = pad + w0 + 44 * u;
  text(S.position, x, cyT + 2 * u, 68 * u, "#eceef1", 600, "left", null, 0.04); x += tw(S.position, 68 * u, 600, 0.04) + 44 * u;
  const meta = S.bpm.toFixed(S.bpm % 1 ? 1 : 0) + " BPM · " + S.sig[0] + "/" + S.sig[1] + (S.loop_on && S.loop ? " · LOOP" : "") + (S.song_mode ? " · SONG" : "");
  text(meta, x, cyT + 2 * u, 44 * u, "#9aa0ab", 500, "left", null, 0.04);
  const right = (S.seq && S.page !== "tape" ? "PATTERN " + S.seq.pattern + "    " :
                 S.auto && S.page === "auto" ? "PATTERN " + S.auto.pattern + "    " : "");
  text(S.song || "NEW PROJECT", W - pad, cyT + 2 * u, 44 * u, S.song ? "#eceef1" : "#5c616c", 600, "right", null, 0.04);
  if (right) text(right, W - pad - tw(S.song || "NEW PROJECT", 44 * u, 600, 0.04), cyT + 2 * u, 44 * u, "#9aa0ab", 500, "right", null, 0.04);
  g.fillStyle = "#1e2127"; g.fillRect(0, topH, W, 2 * u);

  const footH = 250 * u, y1 = H - footH - 16 * u;
  let bottom = "";
  if (S.page === "seq" && SEQ && S.seq) {
    drawSeq(u, pad, topH, y1);
    bottom = S.message || "";
  } else if (S.page === "auto" && S.auto && S.auto.rows) {
    drawAuto(u, pad, topH, y1, S.auto);
    bottom = S.message || "";
  } else if (S.page === "sound" && S.sound && S.sound.knobs) {
    drawSound(u, pad, topH + 6 * u, y1, S.sound);
    if (S.arp && S.arp.rows) drawArp(u, pad, topH, y1, S.arp);
    else if (S.sound.panel && S.sound.panel.rows) drawArp(u, pad, topH, y1, S.sound.panel);
  } else {
    bottom = drawTape(u, pad, topH, y1, P);
    if (S.message) bottom = S.message;
  }
  if (S.menu) drawMenu(u, pad, topH, y1, S.menu);         // a menu or list the Move has open, over everything
  else if (S.fx && S.fx.knobs) drawMenu(u, pad, topH, y1, S.fx);   // SONG INSERT 1 / 2
  else if (S.fx && S.fx.rows) drawArp(u, pad, topH, y1, S.fx);   // left button 3: REVERB / DELAY over whatever is behind
  // ---------------------------------------------------------------- the bottom: a line of text, the Move's own screen
  const fy = H - footH + 10 * u, sh = footH - 30 * u, sw = 440 * u, mh = 220 * u;
  rr(W - pad - sw - 12 * u, H - pad - mh - 12 * u, sw + 12 * u, mh + 12 * u, 16 * u); g.fillStyle = "#111317"; g.fill();
  g.strokeStyle = "#1e2127"; g.lineWidth = 2 * u; g.stroke();
  if (S.screen) {
    if (S.screen !== screenKey) {
      screenKey = S.screen;
      const raw = atob(S.screen), img = g.createImageData(128, 64);
      for (let yy = 0; yy < 64; yy++) for (let xx = 0; xx < 128; xx++) {
        const on = (raw.charCodeAt(yy * 16 + (xx >> 3)) >> (7 - (xx & 7))) & 1, o = (yy * 128 + xx) * 4;
        img.data[o] = on ? 232 : 14; img.data[o + 1] = on ? 233 : 16; img.data[o + 2] = on ? 236 : 19; img.data[o + 3] = 255;
      }
      const oc = document.createElement("canvas"); oc.width = 128; oc.height = 64; oc.getContext("2d").putImageData(img, 0, 0);
      screenImg = oc;
    }
    g.imageSmoothingEnabled = false;
    if (screenImg) g.drawImage(screenImg, W - pad - sw - 6 * u, H - pad - mh - 6 * u, sw, mh);
  }
  if (bottom && !popupShown) text(bottom.slice(0, 90), pad, fy + sh - 34 * u, 40 * u, "#9aa0ab", 500, "left", null, 0.04);
  drawPopup(u);
  drawPageFx(u);
}

// ------------------------------------------------------------------ the page change card (as on the Move: the old
// page's name slides off to the left, the new one's in from the right; any control on the Move cuts it short)
const PF_HOLD_OLD = 0.05, PF_SLIDE = 0.2, PF_HOLD_NEW = 0.35;
let pfId = null, pfStart = 0;
function drawPageFx(u) {
  const p = S.pagefx, now = performance.now();
  if (!p) { pfId = null; return; }
  if (p.id !== pfId) { pfId = p.id; pfStart = now - p.age * 1000; }
  const age = (now - pfStart) / 1000;
  if (age >= PF_HOLD_OLD + PF_SLIDE + PF_HOLD_NEW) return;
  let t = Math.min(1, Math.max(0, (age - PF_HOLD_OLD) / PF_SLIDE));
  t = t * t * (3 - 2 * t);
  g.fillStyle = "#0b0c0e"; g.fillRect(0, 0, W, H);
  const dx = t * W;
  const name = (s, x0) => {
    let size = 220 * u;
    while (tw(s, size, 800, 0.06) > W * 0.86 && size > 40 * u) size -= 4 * u;
    text(s, x0 + W / 2, H / 2, size, "#eceef1", 800, "center", null, 0.06);
  };
  if (dx < W) name(p.from, -dx);
  name(p.to, W - dx);
}

// ------------------------------------------------------------------ a step setting's popup (pads, knob 1, held steps)
let popupId = null, popupAt = 0, popupShown = false;
function drawPopup(u) {
  const p = S.popup, now = performance.now();
  if (p && p.id !== popupId) { popupId = p.id; popupAt = now; }
  const age = (now - popupAt) / 1000;
  popupShown = !!(p && p.id === popupId && age < 2.2);
  if (!popupShown) return;
  const a = Math.min(1, Math.min(age / 0.08, (2.2 - age) / 0.3));   // a quick fade in, a slower fade out
  const w = 760 * u, h = (p.value ? (p.hint ? 470 : 420) : (p.hint ? 340 : 300)) * u, x = (W - w) / 2, y = (H - h) / 2;
  g.globalAlpha = a;
  rr(x, y, w, h, 32 * u); g.fillStyle = "#15171c"; g.fill();
  g.strokeStyle = p.value === "OFF" ? "#5c616c" : "#49d17d"; g.lineWidth = 4 * u; g.stroke();
  let cy = y + 74 * u;
  text(p.top, W / 2, cy, 40 * u, "#9aa0ab", 600, "center", null, 0.08);
  cy += 96 * u;
  let size = 76 * u;
  while (tw(p.label, size, 700, 0.06) > w - 60 * u && size > 30 * u) size -= 2 * u;
  text(p.label, W / 2, cy, size, "#eceef1", 700, "center", null, 0.06);
  if (p.value) {
    cy += 130 * u;
    let vs = 120 * u;
    while (tw(p.value, vs, 800, 0.04) > w - 60 * u && vs > 40 * u) vs -= 2 * u;
    text(p.value, W / 2, cy, vs, p.value === "OFF" ? "#5c616c" : "#49d17d", 800, "center", null, 0.04);
  }
  if (p.hint) text(p.hint, W / 2, y + h - 36 * u, 32 * u, "#5c616c", 600, "center", null, 0.1);
  g.globalAlpha = 1;
}

// ------------------------------------------------------------------ the headline, the same on every page
function titleBlock(u, pad, y0, over, name, nameCol, sub, rightSmall, rightBig, rightCol) {
  const tY = y0 + 64 * u;
  text(over, pad, tY, 30 * u, "#5c616c", 600, "left", null, 0.22);
  text(name, pad, tY + 110 * u, 152 * u, nameCol, 800, "left", null, 0.01);
  if (sub) {
    let size = 88 * u; const room = W - 2 * pad - tw(name, 152 * u, 800, 0.01) - 36 * u - tw(rightBig || "", 80 * u, 700) - 80 * u;
    while (tw(sub, size, 500) > room && size > 40 * u) size -= 4 * u;
    text(sub, pad + tw(name, 152 * u, 800, 0.01) + 36 * u, tY + 122 * u, size, "#eceef1", 500);
  }
  if (rightSmall) text(rightSmall, W - pad, tY + 72 * u, 30 * u, "#5c616c", 600, "right", null, 0.22);
  if (rightBig) text(rightBig, W - pad, tY + 128 * u, 80 * u, rightCol || "#eceef1", 700, "right");
  return tY + 190 * u;
}

// ------------------------------------------------------------------ the tape
function drawTape(u, pad, y0, y1, P) {
  const sel = S.tracks.find(t => t.selected) || S.tracks[0];
  const pan = Math.abs(sel.pan) < 0.05 ? "C" : (sel.pan < 0 ? "L" : "R") + Math.round(Math.abs(sel.pan) * 100);
  const zoom = (S.zoom || 4) + (S.zoom === 1 ? " BAR" : " BARS");
  // on an instrument page (the instrument list, say) this is not about a track: say which instrument
  let y = S.inst ? titleBlock(u, pad, y0, "INSTRUMENTS · SLOT " + S.inst, "INST " + S.inst, ACC, "", "ZOOM", zoom)
                 : titleBlock(u, pad, y0, "TAPE · TRACK " + sel.n + " SELECTED", "TRACK " + sel.n, COLORS[sel.n - 1],
                              sel.input, "ZOOM", zoom);
  const gutter = 272 * u, X0 = pad + gutter + 28 * u, X1 = W - pad;
  const span = (S.zoom || 4) * S.bar, ppb = (X1 - X0) / span, mid = X0 + (X1 - X0) / 2;
  const viewA = P - span / 2, viewB = P + span / 2, total = Math.max(S.length, 8);
  // the whole tape, small
  const ovY = y + 30 * u, ovH = 44 * u;
  rr(X0, ovY, X1 - X0, ovH, 12 * u); g.fillStyle = "#111317"; g.fill();
  S.tracks.forEach((t, i) => {
    for (const b of t.boxes) {
      const a = X0 + b[0] / total * (X1 - X0), w = Math.max(3 * u, (b[1] - b[0]) / total * (X1 - X0));
      g.fillStyle = COLORS[i] + (t.audible ? "ff" : "44"); g.fillRect(a, ovY + 6 * u + i * 4 * u, w, 3 * u);
    }
  });
  g.strokeStyle = "#eceef1"; g.lineWidth = 3 * u;
  rr(X0 + Math.max(0, viewA) / total * (X1 - X0), ovY + 2 * u, Math.max(8 * u, span / total * (X1 - X0)), ovH - 4 * u, 8 * u); g.stroke();
  // the ruler, the lanes
  const rY = ovY + ovH + 50 * u, lTop = rY + 40 * u, n = 8, gap = 18 * u, laneH = (y1 - lTop - (n - 1) * gap) / n;
  g.save(); g.beginPath(); g.rect(X0, rY - 30 * u, X1 - X0, y1 - rY + 30 * u); g.clip();
  for (let k = Math.floor(viewA / S.bar) - 1; k * S.bar <= viewB + S.bar; k++) {
    const bx = mid + (k * S.bar - P) * ppb;
    if (k >= 0 && bx > X0 - 40 * u && bx < X1) text(String(k + 1), bx + 10 * u, rY, 30 * u, "#5c616c", 600, "left", null, 0.14);
  }
  g.restore();
  S.tracks.forEach((t, i) => {
    const ly = lTop + i * (laneH + gap), col = COLORS[i], dim = !t.audible;
    // its card
    rr(pad, ly, gutter, laneH, 20 * u); g.fillStyle = t.selected ? "#17191e" : "#111317"; g.fill();
    if (t.selected) { g.save(); rr(pad, ly, gutter, laneH, 20 * u); g.clip(); g.fillStyle = ACC; g.fillRect(pad, ly, 6 * u, laneH); g.restore(); }
    g.globalAlpha = dim ? 0.35 : 1;
    text(String(t.n), pad + 52 * u, ly + laneH / 2 + 4 * u, Math.min(84 * u, laneH * 0.8), col, 800, "center");
    const tags = [];
    if (t.armed) tags.push(["● ARM", "#ff5a4e"]);
    if (t.muted) tags.push(["MUTE", "#9aa0ab"]);
    if (t.solo) tags.push(["SOLO", "#eceef1"]);
    if (t.stereo) tags.push(["ST", col]);
    let tx = pad + 108 * u;
    if (!tags.length) tags.push(["—", "#2f333a"]);
    for (const [lab, c] of tags) { text(lab, tx, ly + laneH * 0.36, 24 * u, c, 700, "left", null, 0.14); tx += tw(lab, 24 * u, 700, 0.14) + 16 * u; }
    const vx = pad + 108 * u, vw = gutter - 140 * u, vy = ly + laneH * 0.6;
    rr(vx, vy, vw, 8 * u, 4 * u); g.fillStyle = "#262a31"; g.fill();
    rr(vx, vy, Math.max(8 * u, vw * Math.min(1, t.vol)), 8 * u, 4 * u); g.fillStyle = col; g.fill();
    if (t.armed && t.peak > 0) { rr(vx, vy + 16 * u, vw * Math.min(1, t.peak), 6 * u, 3 * u); g.fillStyle = t.peak > 0.95 ? "#ff5a4e" : "#eceef1"; g.fill(); }
    g.globalAlpha = 1;
    // its lane
    g.save(); rr(X0, ly, X1 - X0, laneH, 20 * u); g.clip();
    g.fillStyle = "#0e1013"; g.fillRect(X0, ly, X1 - X0, laneH);
    if (S.loop) {
      const a = mid + (S.loop[0] - P) * ppb, b = mid + (S.loop[1] - P) * ppb;
      g.fillStyle = ACC + (S.loop_on ? "14" : "08"); g.fillRect(a, ly, b - a, laneH);
    }
    const halves = t.stereo && t.waves.length > 1 ? 2 : 1;
    g.globalAlpha = dim ? 0.35 : 1;
    for (const b of t.boxes) {
      const a = mid + (b[0] - P) * ppb, z = mid + (b[1] - P) * ppb;
      if (z < X0 || a > X1) continue;
      rr(a + 2 * u, ly + 8 * u, Math.max(4 * u, z - a - 4 * u), laneH - 16 * u, 16 * u);
      g.fillStyle = col + "1f"; g.fill(); g.strokeStyle = col + "66"; g.lineWidth = 2 * u; g.stroke();
      for (let sd = 0; sd < halves; sd++) {
        const lv = waves[t.waves[sd]];
        if (!lv) continue;
        const hh = (laneH - 28 * u) / halves, cy = ly + 14 * u + sd * hh + hh / 2;
        g.fillStyle = col;
        const xa = Math.max(X0, a + 6 * u), xb = Math.min(X1, z - 6 * u), step = Math.max(2, Math.round(6 * u));
        for (let px = xa; px < xb; px += step) {
          const b0 = P + (px - mid) / ppb, b1 = P + (px + step - mid) / ppb;
          let i0 = Math.floor(b0 * S.res), i1 = Math.max(i0 + 1, Math.floor(b1 * S.res)), m = 0;
          for (let k = Math.max(0, i0); k < Math.min(lv.length, i1); k++) if (lv[k] > m) m = lv[k];

      const k = first + i, r = rows[k], on = k === pick, ry = y + i * rowH;
      if (on) {
        rr(px + inner - 20 * u, ry + 4 * u, listR - px - inner + 40 * u, rowH - 8 * u, 16 * u); g.fillStyle = "#1a1d23"; g.fill();
        g.fillStyle = ACC; g.fillRect(px + inner - 20 * u, ry + 4 * u, 6 * u, rowH - 8 * u);
      }
      let lx = px + inner;
      if (r.n) { text(String(r.n), lx, ry + rowH / 2, rowS, "#5c616c", 600, "left"); lx += 56 * u; }
      const col = A.knobs ? "#9aa0ab" : on ? "#ffffff" : "#6b707a";
      let lab = r.label, ls = rowS;
      const room = listR - lx - (r.text ? tw(r.text, rowS, 700) + 40 * u : 0);
      while (tw(lab, ls, on ? 800 : 600, 0.04) > room && ls > 26 * u) ls -= 2 * u;
      text(lab, lx, ry + rowH / 2, ls, col, on || A.knobs ? 800 : 600, "left", null, 0.04);
      if (r.text) {
        const vcol = A.knobs ? "#ffffff" : on ? "#ffffff" : "#6b707a";
        if (on && A.editing) {
          const w = tw(r.text, rowS, 800) + 28 * u;
          rr(listR - w + 14 * u, ry + 10 * u, w, rowH - 20 * u, 10 * u); g.fillStyle = ACC; g.fill();
          text(r.text, listR, ry + rowH / 2, rowS, "#0b0c0e", 800, "right");
        } else text(r.text, listR, ry + rowH / 2, rowS, vcol, 700, "right");
      }
    }
    if (rows.length > shown) {                         // a hint of where you are in a long list
      const sb = (shown * rowH) * shown / rows.length, sy = top + (shown * rowH - sb) * first / Math.max(1, rows.length - shown);
      g.fillStyle = "#2a2e36"; g.fillRect(listR + 24 * u, top, 4 * u, shown * rowH);
      g.fillStyle = "#9aa0ab"; g.fillRect(listR + 24 * u, sy, 4 * u, sb);
    }
    if (imgW) {
      const ix = px + pw - inner - imgW, iy = top + 6 * u;
      g.fillStyle = "#000000"; g.fillRect(ix, iy, imgW, imgH);
      g.strokeStyle = "#eceef1"; g.lineWidth = 2 * u; g.strokeRect(ix, iy, imgW, imgH);
      if (img) { g.imageSmoothingEnabled = false; g.drawImage(img, ix + 3 * u, iy + 3 * u, imgW - 6 * u, imgH - 6 * u); }
    }
    y += Math.max(rows.length ? shown * rowH : 80 * u, imgH) + 20 * u;
  }
  if (A.steps) {                                       // song mode: its rows, as the step buttons show them
    text("ROWS", px + inner, y + 30 * u, 34 * u, "#5c616c", 600, "left", null, 0.14);
    for (let i = 0; i < Math.min(16, A.steps); i++) {
      const sx = px + inner + 140 * u + i * 60 * u, sz = 40 * u;
      rr(sx, y + 10 * u, sz, sz, 8 * u);
      g.fillStyle = i === A.step_at ? ACC : "#262a31"; g.fill();
      if (i === A.step_playing) { g.strokeStyle = "#ffffff"; g.lineWidth = 3 * u; g.stroke(); }
    }
    y += 100 * u;
  }
  if (A.hint) {
    let hs = 34 * u;
    while (tw(A.hint, hs, 600, 0.06) > pw - 2 * inner && hs > 22 * u) hs -= 1 * u;
    text(A.hint, px + inner, py + h - 56 * u, hs, "#9aa0ab", 600, "left", null, 0.06);
  }
  g.restore();
}

function seqTitle(u, pad, y0, title, sub, L, small) {
  const big = "PATTERN " + L.pattern + (L.queued ? " → " + L.queued : "");
  const y = titleBlock(u, pad, y0, "INSTRUMENT " + (SEQ.slot || "") + " · SEQUENCER" + (L.rec ? " · ● RECORDING" : ""),
                       title, ACC, sub, small, big, L.queued ? ACC : "#eceef1");
  g.fillStyle = "#1e2127"; g.fillRect(0, y + 40 * u, W, 2 * u);
  return y + 40 * u;
}

// the AUTOMATION page: one row per setting locked on some step (the Move's knob 1 picks one: its row is lit),
// each step's value in that setting's colour (the same colours as the Move's step buttons)
const AUTO_COLOURS = ["#ff5a4e", "#ff9a3c", "#f5d33f", "#49d17d", "#3fd0c9", "#b48ae6"];
function drawAuto(u, pad, y0, y1, A) {
  const n = A.rows.length, pick = A.pick, col = pick >= 0 ? AUTO_COLOURS[pick % AUTO_COLOURS.length] : ACC;
  const cur = pick >= 0 ? A.rows[pick] : null;
  const big = A.held != null && A.held_value ? "STEP " + (A.held + 1) + "  " + A.held_value :
              cur ? Object.keys(cur.steps).length + " STEPS" : "";
  const top0 = titleBlock(u, pad, y0, "AUTOMATION · INSTRUMENT " + A.slot + (A.name ? " · " + A.name : ""),
                          cur ? cur.label : "NO AUTOMATION", col, A.title, pick >= 0 ? "SETTING " + (pick + 1) + " OF " + n : "",
                          big, A.held != null ? "#ffffff" : col);
  if (!n) {
    text("Press Record and turn the sound page's knobs while it plays, or set steps with Shift + steps on the sequencer.",
         pad, top0 + 80 * u, 40 * u, "#9aa0ab", 500, "left", null, 0.02);
    return;
  }
  const gutter = 272 * u, X0 = pad + gutter + 28 * u, X1 = W - pad, cols = Math.max(16, A.length), cw = (X1 - X0) / cols;
  const numY = top0 + 50 * u, gTop = numY + 36 * u, gap = 12 * u;
  const rh = Math.max(40 * u, Math.min(150 * u, (y1 - 60 * u - gTop - (n - 1) * gap) / n));
  for (let i = 0; i < cols; i += 4) text(String(i + 1), X0 + i * cw + 8 * u, numY, 30 * u, "#5c616c", 600, "left", null, 0.14);
  const shown = (A.first != null) ? [A.first, Math.min(A.first + 16, A.length)] : [0, A.length];
  A.rows.forEach((r, ri) => {
    const y = gTop + ri * (rh + gap), isSel = ri === pick, rc = AUTO_COLOURS[ri % AUTO_COLOURS.length];
    if (y + rh > y1 + 10 * u) return;
    rr(pad, y, gutter, rh, 18 * u); g.fillStyle = isSel ? "#17191e" : "#111317"; g.fill();
    if (isSel) { g.save(); rr(pad, y, gutter, rh, 18 * u); g.clip(); g.fillStyle = rc; g.fillRect(pad, y, 6 * u, rh); g.restore(); }
    let nsz = 32 * u; while (tw(r.label, nsz, 600, 0.12) > gutter - 50 * u && nsz > 16 * u) nsz -= 2 * u;
    text(r.label, pad + 32 * u, y + rh / 2, nsz, isSel ? "#eceef1" : "#9aa0ab", 600, "left", null, 0.12);
    if (isSel) { rr(X0 + shown[0] * cw - 2 * u, y - 6 * u, (shown[1] - shown[0]) * cw + 4 * u, rh + 12 * u, 18 * u);
      g.strokeStyle = rc + "88"; g.lineWidth = 4 * u; g.stroke(); }
    for (let i = 0; i < A.length; i++) {
      const x = X0 + i * cw, bx = x + 4 * u, bw = cw - 8 * u, v = r.steps[String(i)];
      rr(bx, y, bw, rh, Math.min(12 * u, bw / 4));
      if (A.dark && i % 4 === 3) { g.strokeStyle = "#1e2127"; g.lineWidth = 2 * u; g.stroke(); continue; }
      if (v != null) {
        g.globalAlpha = isSel ? 1 : 0.55; g.fillStyle = rc; g.fill(); g.globalAlpha = 1;
        let vs = Math.min(26 * u, rh * 0.36); while (tw(v, vs, 700) > bw - 6 * u && vs > 10 * u) vs -= 1 * u;
        text(v, bx + bw / 2, y + rh / 2, vs, "#0b0c0e", 700, "center");
      } else { g.fillStyle = "#15171c"; g.fill(); }
      if (isSel && A.held === i) { rr(bx - 4 * u, y - 4 * u, bw + 8 * u, rh + 8 * u, 14 * u); g.strokeStyle = "#ffffff"; g.lineWidth = 6 * u; g.stroke(); }
      if (A.at === i) { rr(bx - 2 * u, y - 2 * u, bw + 4 * u, rh + 4 * u, 14 * u); g.strokeStyle = "#ffffffaa"; g.lineWidth = 3 * u; g.stroke(); }
    }
  });
  if (A.confirm && cur) {
    const msg = "TAKE " + cur.label + " OFF " + Object.keys(cur.steps).length + " STEPS?  SHIFT + DELETE AGAIN: YES";
    rr(pad, y1 - 70 * u, W - 2 * pad, 64 * u, 16 * u); g.fillStyle = "#2a1414"; g.fill();
    text(msg, W / 2, y1 - 38 * u, 34 * u, "#ff9a8c", 700, "center", null, 0.06);
  }
}

function drawDrums(u, pad, y0, y1, L) {
  const lanes = SEQ.lanes, sel = Math.min(L.lane || 0, lanes.length - 1), ln0 = lanes[sel];
  const a = L.first + 1, b = Math.min(L.first + 16, ln0 ? ln0.length : 16);
  const top0 = seqTitle(u, pad, y0, SEQ.title, ln0 ? ln0.name : "", L, "BUTTONS SHOW STEPS " + a + "–" + b);
  const leg = 60 * u, gutter = 272 * u, rightW = 168 * u, X0 = pad + gutter + 28 * u, X1 = W - pad - rightW;
  const cols = Math.max(16, ...lanes.map(l => l.length)), cw = (X1 - X0) / cols;
  const numY = top0 + 64 * u, gTop = numY + 36 * u, gap = 14 * u;
  const rh = Math.min(200 * u, (y1 - leg - gTop - (lanes.length - 1) * gap) / lanes.length);
  for (let i = 0; i < cols; i += 4) text(String(i + 1), X0 + i * cw + 8 * u, numY, 30 * u, "#5c616c", 600, "left", null, 0.14);
  lanes.forEach((ln, li) => {
    const y = gTop + li * (rh + gap), col = COLORS[li % COLORS.length], isSel = li === sel;
    rr(pad, y, gutter, rh, 20 * u); g.fillStyle = isSel ? "#17191e" : "#111317"; g.fill();
    if (isSel) { g.save(); rr(pad, y, gutter, rh, 20 * u); g.clip(); g.fillStyle = ACC; g.fillRect(pad, y, 6 * u, rh); g.restore(); }
    let nsz = 34 * u; while (tw(ln.name, nsz, 600, 0.14) > gutter - 50 * u && nsz > 18 * u) nsz -= 2 * u;
    text(ln.name, pad + 36 * u, y + rh / 2, nsz, isSel ? "#eceef1" : "#9aa0ab", 600, "left", null, 0.14);
    text(String(ln.length), W - pad, y + rh / 2 - 16 * u, 40 * u, "#9aa0ab", 700, "right");
    text(ln.rate + (ln.hits ? " · E" + ln.hits : ""), W - pad, y + rh / 2 + 24 * u, 28 * u, "#5c616c", 600, "right", null, 0.1);
    if (isSel) { rr(X0 + L.first * cw - 2 * u, y - 6 * u, Math.min(16, ln.length - L.first) * cw + 4 * u, rh + 12 * u, 20 * u);
      g.strokeStyle = ACC + "88"; g.lineWidth = 4 * u; g.stroke(); }
    const at = stepNow(L, ln.spb, ln.length, ln.straight, L.at ? L.at[li] : null);
    for (let i = 0; i < ln.length; i++) {
      const st = ln.steps[i], x = X0 + i * cw;
      if (ln.group && i % ln.group === 0 && i) { g.fillStyle = "#2b2f37"; g.fillRect(x - 1 * u, y - 8 * u, 2 * u, rh + 16 * u); }
      const bx = x + 4 * u, bw = cw - 8 * u;
      if (SEQ.dark && i % 4 === 3) {                 // TRIPLETS: every 4th step is off
        rr(bx, y, bw, rh, Math.min(14 * u, bw / 4)); g.strokeStyle = "#1e2127"; g.lineWidth = 2 * u; g.stroke();
        continue;
      }
      rr(bx, y, bw, rh, Math.min(14 * u, bw / 4));
      if (st[0]) {
        g.globalAlpha = 0.45 + 0.55 * (st[1] ? st[1] / 127 : 0.8); g.fillStyle = col; g.fill(); g.globalAlpha = 1;
        let mark = "";
        if (st[2]) mark = SEQ.chances[st[2]];
        else if (st[3] !== 1) mark = "×" + (st[3] || "?");
        else if (!st[1]) mark = "?";
        else if (st[4] || st[5]) mark = "◆";
        if (mark) { let ms = 26 * u; while (tw(mark, ms, 700) > bw - 6 * u && ms > 12 * u) ms -= 1 * u;
          text(mark, bx + bw / 2, y + rh - 22 * u, ms, "#0b0c0e", 700, "center"); }
      } else { g.fillStyle = "#15171c"; g.fill(); }
      if (isSel && (L.selected || []).includes(i)) { rr(bx - 4 * u, y - 4 * u, bw + 8 * u, rh + 8 * u, 16 * u); g.strokeStyle = ACC; g.lineWidth = 4 * u; g.stroke(); }
      if (at === i) { rr(bx - 3 * u, y - 3 * u, bw + 6 * u, rh + 6 * u, 16 * u); g.strokeStyle = "#ffffff"; g.lineWidth = 6 * u; g.stroke(); }
    }
  });
  let lx = pad;
  for (const t of ["BRIGHTNESS · VELOCITY", "40% · CHANCE", "×3 · RATCHET", "? · RANDOM", "◆ · LOCKS"]) {
    text(t, lx, y1 - 18 * u, 28 * u, "#5c616c", 600, "left", null, 0.16); lx += tw(t, 28 * u, 600, 0.16) + 56 * u;
  }
}

function drawNotes(u, pad, y0, y1, L) {
  const top0 = seqTitle(u, pad, y0, SEQ.title, SEQ.root + " " + SEQ.scale, L,
                        SEQ.rate + " · " + SEQ.length + " STEPS" + (SEQ.per_note ? " · PER NOTE" : ""));
  const notes = SEQ.notes, shown = L.shown || [];
  let lo = Math.min(...shown, ...notes.map(n => n[1])), hi = Math.max(...shown, ...notes.map(n => n[1]));
  if (!isFinite(lo)) { lo = 48; hi = 72; }
  lo = Math.max(0, lo - 2); hi = Math.min(127, hi + 2);
  while (hi - lo < 24) { if (lo > 0) lo--; if (hi - lo < 24 && hi < 127) hi++; if (lo === 0 && hi === 127) break; }
  const rows = hi - lo + 1, numY = top0 + 64 * u, top = numY + 36 * u, keysW = 200 * u, X0 = pad + keysW + 28 * u, X1 = W - pad;
  const cols = Math.max(16, SEQ.length), cw = (X1 - X0) / cols, rh = (y1 - top) / rows;
  const inScale = n => SEQ.degrees.includes(n % 12), black = n => [1, 3, 6, 8, 10].includes(n % 12);
  const sMin = Math.min(...shown), sMax = Math.max(...shown);
  rr(X0, top, X1 - X0, y1 - top, 20 * u); g.fillStyle = "#0e1013"; g.fill();
  g.save(); rr(X0, top, X1 - X0, y1 - top, 20 * u); g.clip();
  for (let n = lo; n <= hi; n++) {
    const y = top + (hi - n) * rh;
    if (inScale(n)) { g.fillStyle = n >= sMin && n <= sMax ? "#17191e" : "#121418"; g.fillRect(X0, y + 1 * u, X1 - X0, rh - 2 * u); }
  }
  const spb = SEQ.spb || 4, barSteps = Math.round(spb * (SEQ.bar_beats || 4));
  for (let i = 1; i < cols; i++) {
    const x = X0 + i * cw, bar = i % barSteps === 0, beat = i % spb === 0;
    if (bar || beat) { g.fillStyle = bar ? "#2b2f37" : "#1b1e23"; g.fillRect(x - 1 * u, top, bar ? 3 * u : 2 * u, y1 - top); }
  }
  g.fillStyle = ACC + "10"; g.fillRect(X0 + L.first * cw, top, Math.min(16, SEQ.length - L.first) * cw, y1 - top);
  if (SEQ.dark) for (let i = 3; i < cols; i += 4) { g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(X0 + i * cw, top, cw, y1 - top); }
  if (SEQ.length < cols) { g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(X0 + SEQ.length * cw, top, (cols - SEQ.length) * cw, y1 - top); }
  for (const [step, note, len, vel, chance, ratchet, locks, comp] of notes) {
    if (note < lo || note > hi) continue;
    const x = X0 + step * cw + 3 * u, y = top + (hi - note) * rh + 3 * u, w = Math.max(8 * u, len * cw - 6 * u), h = Math.max(6 * u, rh - 6 * u);
    const shade = COLORS[((note % 12) * 5) % 8];
    rr(x, y, w, h, Math.min(10 * u, h / 3));
    const faded = (SEQ.per_note && L.lane !== null && L.lane !== undefined && L.lane !== note) || (SEQ.dark && step % 4 === 3);
    g.globalAlpha = (faded ? 0.3 : 1) * (0.5 + 0.5 * (vel ? vel / 127 : 0.8)); g.fillStyle = shade; g.fill(); g.globalAlpha = 1;
    if ((L.selected || []).includes(step) || (L.down || []).includes(step)) { g.strokeStyle = "#eceef1"; g.lineWidth = 4 * u; g.stroke(); }
    const mark = chance ? "%" : ratchet !== 1 ? "×" + (ratchet || "?") : (!vel ? "?" : (locks || comp ? "◆" : ""));
    if (mark && h > 22 * u && w > 30 * u) text(mark, x + 10 * u, y + h / 2, Math.min(24 * u, h * 0.7), "#0b0c0e", 700);
  }
  const atN = (L.lane === null || L.lane === undefined || !SEQ.per_note) ? stepNow(L, SEQ.spb, SEQ.length, SEQ.straight, L.at) : L.at;
  if (atN !== null && atN !== undefined) { g.fillStyle = "#ffffff"; g.fillRect(X0 + atN * cw - 2 * u, top, 5 * u, y1 - top); }
  g.restore();
  for (let i = 0; i < cols; i += barSteps) text(String(i / barSteps + 1), X0 + i * cw + 10 * u, numY, 30 * u, "#5c616c", 600, "left", null, 0.14);
  // the keyboard
  for (let n = lo; n <= hi; n++) {
    const y = top + (hi - n) * rh;
    rr(pad, y + 1 * u, keysW, rh - 2 * u, Math.min(8 * u, rh / 3)); g.fillStyle = black(n) ? "#15171c" : "#2a2e35"; g.fill();
    if (shown.includes(n)) { g.fillStyle = ACC; g.fillRect(pad + keysW - 8 * u, y + 3 * u, 6 * u, rh - 6 * u); }
    if (L.lane === n && SEQ.per_note) { g.strokeStyle = ACC; g.lineWidth = 3 * u; g.stroke(); }
    if (n % 12 === 0 || rh > 34 * u) text(NAMES[n % 12] + (Math.floor(n / 12) - 1), pad + 20 * u, y + rh / 2 + 1 * u, Math.min(28 * u, rh * 0.72),
      inScale(n) ? "#eceef1" : "#5c616c", 600, "left", null, 0.06);
  }
}
</script>
</body>
</html>
