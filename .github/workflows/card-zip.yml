name: Build card zip

# Builds Console-MPC.zip (the "autorun" and "Console" folders to unzip onto the MPC Sample's SD card) from:
#   Console's code        the console/ folder of this repo
#   the synths/effects    the "libs-latest" release of this repo (made by the "Import libs" workflow)
#   the bridge + screens  the "bridge-latest" release of this repo (built by "Build MPC bridge")
#   Python + numpy        the "runtime-latest" release of this repo
# and publishes it as the "card-latest" release. Runs after every successful bridge build, when card/ changes, on a
# version tag (v1.0.0 ... : also attached to that tag's release), or by hand.

on:
  workflow_run:
    workflows: ["Build MPC bridge"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["card/**", "tools/make-card.sh", ".github/workflows/card-zip.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish this version as a release (e.g. 1.0.0): also creates the tag v<version>"
        required: false
      remove:
        description: "A version to delete once this one is published (e.g. 1.0.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: card-zip           # (two builds at once would both try to make the same release)
  cancel-in-progress: false

jobs:
  card:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the installer
        run: |
          sh card/test/run.sh
          sh card/test/data.sh
      - name: Download the parts
        run: |
          mkdir -p parts
          gh release download bridge-latest  --repo "$GITHUB_REPOSITORY" -p mpc-bridge.tgz  -D parts
          gh release download runtime-latest --repo "$GITHUB_REPOSITORY" -p mpc-python.tgz  -D parts
          gh release download libs-latest --repo "$GITHUB_REPOSITORY" -p move-libs.tgz -D parts
          ls -l parts
      - name: Build the zip
        run: |
          sh tools/make-card.sh console parts/move-libs.tgz parts/mpc-bridge.tgz parts/mpc-python.tgz out
          unzip -t out/Console-MPC.zip | tail -n 1
      - name: Publish card-latest
        run: |
          gh release delete card-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create card-latest --prerelease out/Console-MPC.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Console for the MPC Sample: SD card zip (built $(date -u +%F\ %H:%M) UTC)" \
            --notes "Unzip onto the root of the SD card (the autorun and Console folders), put the card in the MPC Sample, switch on. See Console/README.txt inside."
      - name: Attach to the version tag's release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        run: |
          # the notes: this version's section of CHANGELOG.md (from its "## <version>" line to the next "## ")
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; TAG="v$v"; else TAG="${GITHUB_REF_NAME}"; v="${TAG#v}"; fi
          awk -v v="$v" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Console for the MPC Sample $TAG" > notes.md
          gh release create "$TAG" out/Console-MPC.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Console for the MPC Sample $TAG" --notes-file notes.md
          # the rolling releases are pre-releases, so "latest" is always a version
          if [ -n "${{ inputs.remove }}" ]; then gh release delete "v${{ inputs.remove }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; fi
          for t in bridge-latest runtime-latest card-latest; do gh release edit "$t" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false || true; done
