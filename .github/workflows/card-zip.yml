name: Build card zip

# Builds Console-MPC.zip (the "autorun" and "Console" folders to unzip onto the MPC Sample's SD card) from:
#   Console's code        briwil/console-move (public)
#   the synths/effects    the "libs-latest" release of briwil/console-move
#   the bridge + screens  the "bridge-latest" release of this repo (built by "Build MPC bridge")
#   Python + numpy        the "runtime-latest" release of this repo
# and publishes it as the "card-latest" release. Runs after every successful bridge build, when card/ changes, on a
# version tag (v1.0.0 ... : also attached to that tag's release), or by hand.

on:
  workflow_run:
    workflows: ["Build MPC bridge"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["card/**", "tools/make-card.sh", ".github/workflows/card-zip.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: briwil/console-move
          path: move-src
      - name: Test the installer
        run: sh card/test/run.sh
      - name: Download the parts
        run: |
          mkdir -p parts
          gh release download bridge-latest  --repo "$GITHUB_REPOSITORY" -p mpc-bridge.tgz  -D parts
          gh release download runtime-latest --repo "$GITHUB_REPOSITORY" -p mpc-python.tgz  -D parts
          curl -fsSL -o parts/move-libs.tgz https://github.com/briwil/console-move/releases/download/libs-latest/move-libs.tgz
          ls -l parts
      - name: Build the zip
        run: |
          sh tools/make-card.sh move-src parts/move-libs.tgz parts/mpc-bridge.tgz parts/mpc-python.tgz out
          unzip -t out/Console-MPC.zip | tail -n 1
      - name: Publish card-latest
        run: |
          gh release delete card-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create card-latest out/Console-MPC.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Console for the MPC Sample: SD card zip (built $(date -u +%F\ %H:%M) UTC)" \
            --notes "Unzip onto the root of the SD card (the autorun and Console folders), put the card in the MPC Sample, switch on. See Console/README.txt inside."
      - name: Attach to the version tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" out/Console-MPC.zip --repo "$GITHUB_REPOSITORY" --title "Console for the MPC Sample ${GITHUB_REF_NAME}" --generate-notes
